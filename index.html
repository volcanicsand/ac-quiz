<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Crossing: New Horizons Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #e8f5e2;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(167, 219, 167, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(135, 206, 235, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 218, 185, 0.3) 0%, transparent 50%);
            min-height: 100vh;
            color: #5c4a32;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
        }

        .header {
            text-align: center;
            padding: 1.5rem 0 1rem;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #3d7c47;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
            line-height: 1.2;
        }

        .header .leaf {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.3rem;
        }

        .header .subtitle {
            font-size: 0.9rem;
            color: #7a9a5a;
            margin-top: 0.3rem;
        }

        .score-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.7);
            border-radius: 20px;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-weight: 700;
            font-size: 0.9rem;
            border: 2px solid rgba(61,124,71,0.15);
        }

        .score-bar span {
            color: #3d7c47;
        }

        .mode-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .mode-btn {
            background: rgba(255,255,255,0.8);
            border: 2px solid rgba(61,124,71,0.2);
            border-radius: 12px;
            padding: 0.7rem 0.5rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: #5c4a32;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .mode-btn:hover {
            background: rgba(255,255,255,1);
            border-color: #3d7c47;
            transform: translateY(-1px);
        }

        .mode-btn.active {
            background: #3d7c47;
            color: white;
            border-color: #3d7c47;
        }

        .mode-btn .mode-icon {
            display: block;
            font-size: 1.3rem;
            margin-bottom: 0.2rem;
        }

        .question-card {
            background: rgba(255,255,255,0.85);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 2px solid rgba(61,124,71,0.12);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .question-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #7a9a5a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: #3d5a28;
            line-height: 1.4;
            margin-bottom: 1.2rem;
        }

        .question-text .highlight {
            color: #c0732a;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .option-btn {
            background: #f0f7ec;
            border: 2px solid rgba(61,124,71,0.15);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: #5c4a32;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }

        .option-btn:hover:not(.disabled) {
            background: #e0efda;
            border-color: #3d7c47;
            transform: translateX(4px);
        }

        .option-btn.correct {
            background: #c8e6c0;
            border-color: #3d7c47;
            color: #2d5a1e;
        }

        .option-btn.wrong {
            background: #f5d0c0;
            border-color: #c0732a;
            color: #8b4513;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }

        .option-btn.reveal {
            border-color: #3d7c47;
            border-style: dashed;
        }

        .feedback {
            text-align: center;
            padding: 1rem;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 12px;
            margin-top: 1rem;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: #d4edda;
            color: #2d5a1e;
        }

        .feedback.wrong {
            display: block;
            background: #fde8e0;
            color: #8b4513;
        }

        .next-btn {
            display: none;
            width: 100%;
            background: #3d7c47;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.9rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background: #2d5a33;
        }

        .streak-display {
            text-align: center;
            font-size: 0.85rem;
            color: #7a9a5a;
            font-weight: 600;
            margin-top: 0.3rem;
        }

        .npc-badge {
            display: inline-block;
            background: #ffeaa7;
            color: #8b6914;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 8px;
            margin-left: 0.3rem;
            vertical-align: middle;
        }

        .fun-fact {
            font-size: 0.85rem;
            color: #7a9a5a;
            font-style: italic;
            margin-top: 0.5rem;
            text-align: center;
        }

        @media (max-width: 400px) {
            .header h1 { font-size: 1.3rem; }
            .question-text { font-size: 1.05rem; }
            .option-btn { font-size: 0.9rem; padding: 0.7rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="leaf">🍃</span>
            <h1>Animal Crossing<br>New Horizons Quiz</h1>
            <div class="subtitle">How well do you know your villagers?</div>
        </div>

        <div class="score-bar">
            <div>Score: <span id="score">0</span>/<span id="total">0</span></div>
            <div>Streak: <span id="streak">0</span></div>
            <div>Best: <span id="best">0</span></div>
        </div>

        <div class="mode-select">
            <button class="mode-btn active" onclick="setMode('mix')">
                <span class="mode-icon">🎲</span>Random Mix
            </button>
            <button class="mode-btn" onclick="setMode('species')">
                <span class="mode-icon">🐱</span>Guess Species
            </button>
            <button class="mode-btn" onclick="setMode('personality')">
                <span class="mode-icon">💬</span>Guess Personality
            </button>
            <button class="mode-btn" onclick="setMode('catchphrase')">
                <span class="mode-icon">🗨️</span>Catchphrase
            </button>
            <button class="mode-btn" onclick="setMode('whoareyou')">
                <span class="mode-icon">❓</span>Who Am I?
            </button>
            <button class="mode-btn" onclick="setMode('npc')">
                <span class="mode-icon">⭐</span>Special NPCs
            </button>
        </div>

        <div class="question-card">
            <div class="question-label" id="q-label">Question</div>
            <div class="question-text" id="q-text">Pick a mode to start!</div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
        </div>
        <div class="streak-display" id="streak-msg"></div>
    </div>

const allSpecies = [...new Set(villagers.map(v => v.s))].sort();
const allPersonalities = ["Normal","Peppy","Snooty","Sisterly","Lazy","Jock","Cranky","Smug"];

const correctMessages = [
    "Nailed it!",
    "You got it!",
    "That's right!",
    "Correct!",
    "Nice one!",
    "Woohoo!",
    "You know your villagers!",
    "Perfect!",
    "Absolutely right!",
    "Gold star!"
];

const wrongMessages = [
    "Not quite!",
    "Oops!",
    "Close, but no...",
    "Good guess, but...",
    "Not this time!",
    "Almost!"
];

let currentMode = 'mix';
let score = 0;
let total = 0;
let streak = 0;
let best = 0;
let answered = false;

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function pick(arr, n, exclude) {
    const filtered = exclude ? arr.filter(x => x !== exclude) : [...arr];
    return shuffle(filtered).slice(0, n);
}

function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    event.target.closest('.mode-btn').classList.add('active');
    nextQuestion();
}

function generateSpeciesQuestion() {
    const v = pickRandom(villagers);
    const wrongSpecies = pick(allSpecies, 3, v.s);
    const options = shuffle([v.s, ...wrongSpecies]);
    return {
        label: "Guess the Species",
        text: `What species is <span class="highlight">${v.n}</span>?`,
        options: options,
        answer: v.s,
        fact: `${v.n} is a ${v.s} with a ${v.p} personality!`
    };
}

function generatePersonalityQuestion() {
    const v = pickRandom(villagers);
    const wrongP = pick(allPersonalities, 3, v.p);
    const options = shuffle([v.p, ...wrongP]);
    return {
        label: "Guess the Personality",
        text: `What is <span class="highlight">${v.n}</span> the ${v.s}'s personality type?`,
        options: options,
        answer: v.p,
        fact: `${v.n}'s catchphrase is "${v.c}"!`
    };
}

function generateCatchphraseQuestion() {
    const v = pickRandom(villagers);
    const wrongCatch = pick(villagers, 3, v).map(x => x.c);
    const options = shuffle([v.c, ...wrongCatch]);
    return {
        label: "Name That Catchphrase",
        text: `What is <span class="highlight">${v.n}</span> the ${v.s}'s catchphrase?`,
        options: options.map(o => `"${o}"`),
        answer: `"${v.c}"`,
        fact: `${v.n} is a ${v.p} ${v.s}!`
    };
}

function generateWhoAmIQuestion() {
    const v = pickRandom(villagers);
    const wrongNames = pick(villagers, 3, v).map(x => x.n);
    const options = shuffle([v.n, ...wrongNames]);
    return {
        label: "Who Am I?",
        text: `I'm a <span class="highlight">${v.s}</span> with a <span class="highlight">${v.p}</span> personality. My catchphrase is <span class="highlight">"${v.c}"</span>. Who am I?`,
        options: options,
        answer: v.n,
        fact: `It's ${v.n}!`
    };
}

function generateNPCQuestion() {
    const type = Math.random() < 0.5 ? 'role' : 'species';
    const npc = pickRandom(npcs);

    if (type === 'role') {
        const wrongNPCs = pick(npcs, 3, npc);
        const options = shuffle([npc.n, ...wrongNPCs.map(n => n.n)]);
        // Truncate role for display
        const shortRole = npc.r.length > 100 ? npc.r.substring(0, 100) + '...' : npc.r;
        return {
            label: "Special Character",
            text: `Who is this? <span class="highlight">${shortRole}</span>`,
            options: options,
            answer: npc.n,
            fact: `${npc.n} is a ${npc.s}!`
        };
    } else {
        const npcSpecies = [...new Set(npcs.map(n => n.s))];
        const wrongSpecies = pick(npcSpecies, 3, npc.s);
        // Pad with villager species if not enough NPC species
        while (wrongSpecies.length < 3) {
            const sp = pickRandom(allSpecies);
            if (sp !== npc.s && !wrongSpecies.includes(sp)) wrongSpecies.push(sp);
        }
        const options = shuffle([npc.s, ...wrongSpecies.slice(0, 3)]);
        return {
            label: "Special Character",
            text: `What species is <span class="highlight">${npc.n}</span>?`,
            options: options,
            answer: npc.s,
            fact: `${npc.n} (${npc.s}): ${npc.r.substring(0, 80)}...`
        };
    }
}

function generateQuestion() {
    if (currentMode === 'species') return generateSpeciesQuestion();
    if (currentMode === 'personality') return generatePersonalityQuestion();
    if (currentMode === 'catchphrase') return generateCatchphraseQuestion();
    if (currentMode === 'whoareyou') return generateWhoAmIQuestion();
    if (currentMode === 'npc') return generateNPCQuestion();
    // mix
    const generators = [
        generateSpeciesQuestion,
        generatePersonalityQuestion,
        generateCatchphraseQuestion,
        generateWhoAmIQuestion,
        generateNPCQuestion
    ];
    return pickRandom(generators)();
}

function nextQuestion() {
    answered = false;
    const q = generateQuestion();

    document.getElementById('q-label').textContent = q.label;
    document.getElementById('q-text').innerHTML = q.text;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').textContent = '';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('streak-msg').textContent = '';

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';

    q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => handleAnswer(btn, opt, q);
        optionsDiv.appendChild(btn);
    });
}

function handleAnswer(btn, selected, q) {
    if (answered) return;
    answered = true;
    total++;

    const isCorrect = selected === q.answer;
    const feedback = document.getElementById('feedback');
    const buttons = document.querySelectorAll('.option-btn');

    buttons.forEach(b => {
        b.classList.add('disabled');
        if (b.textContent === q.answer) {
            b.classList.add('correct');
        }
    });

    if (isCorrect) {
        score++;
        streak++;
        if (streak > best) best = streak;
        btn.classList.add('correct');
        feedback.className = 'feedback correct';
        feedback.innerHTML = pickRandom(correctMessages);
        if (q.fact) feedback.innerHTML += `<div class="fun-fact">${q.fact}</div>`;
    } else {
        streak = 0;
        btn.classList.add('wrong');
        feedback.className = 'feedback wrong';
        feedback.innerHTML = `${pickRandom(wrongMessages)} The answer was <strong>${q.answer}</strong>.`;
        if (q.fact) feedback.innerHTML += `<div class="fun-fact">${q.fact}</div>`;
    }

    document.getElementById('score').textContent = score;
    document.getElementById('total').textContent = total;
    document.getElementById('streak').textContent = streak;
    document.getElementById('best').textContent = best;
    document.getElementById('next-btn').style.display = 'block';

    if (streak >= 5) {
        const msgs = ["You're on fire!", "Unstoppable!", "Amazing streak!", "Keep going!", "Incredible run!"];
        document.getElementById('streak-msg').textContent = `🔥 ${streak} in a row! ${pickRandom(msgs)}`;
    } else if (streak >= 3) {
        document.getElementById('streak-msg').textContent = `✨ ${streak} in a row! Nice!`;
    }
}

// Start with first question
nextQuestion();
    </script>
</body>
